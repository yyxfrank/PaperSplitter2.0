<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}PaperSplitter{% endblock %} — Exam Paper Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <!-- MathJax: render LaTeX formulas ($...$ / $$...$$) in syllabus objectives -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
    <!-- Top navigation bar -->
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="{{ url_for('syllabus') }}" class="logo">PaperSplitter</a>
            <nav class="nav-links">
                <a href="{{ url_for('syllabus') }}">Syllabus</a>
            </nav>
            <form action="{{ url_for('search') }}" method="get" style="margin-left:auto; display:flex; gap:0.5rem;">
            <input type="text"
                    name="q"
                    placeholder="搜索章节..."
                    value="{{ request.args.get('q', '') }}"
                    style="padding:0.35rem 0.75rem; border-radius:4px; border:1px solid #444; background:#2a2a3e; color:#fff; font-size:0.85rem;">
            <button type="submit"
                    style="padding:0.35rem 0.75rem; border-radius:4px; border:none; background:#2d6a9f; color:#fff; font-size:0.85rem; cursor:pointer;">搜索</button>
</form>
        </div>
    </header>

    <!-- Page content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
